name: CI

on:
  pull_request:
    branches: ["2.0"]
  push:
    branches: ["2.0"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/validate_migration_contracts.py

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go mod download
      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          for file in $files; do
            gofmt -d "$file"
          done
          test -z "$files"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 -m unittest discover -s clients -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python3 -m py_compile clients/client-linux.py clients/client-psutil.py clients/host_collector.py scripts/export-hermes-status.py scripts/hermes_config_summary.py
      - run: sh -n clients/entrypoint.sh && bash -n status.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node --test web/js/app.test.js
      - run: python3 scripts/check_release_boundaries.py

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: ADMIN_TOKEN=ci-placeholder docker compose -f docker-compose-server.yml config --quiet
      - run: SERVER=192.0.2.10 SERVERSTATUS_USER=ci-node PASSWORD=ci-placeholder CLIENT_PRIVILEGED=false HERMES_ROOT_HOST=/tmp/hermes CLIENT_STATUS_DIR_HOST=/tmp/client-status docker compose -f docker-compose-client.yml config --quiet

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Prepare image provenance
        id: provenance
        shell: bash
        run: |
          echo "candidate_tag=2.5-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "product_version=2.5" >> "$GITHUB_OUTPUT"
          echo "vcs_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "source=https://github.com/404404/HermesStatus" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: false
          load: true
          tags: hermesstatus-server:${{ steps.provenance.outputs.candidate_tag }}
          build-args: |
            VERSION=${{ steps.provenance.outputs.product_version }}
            VCS_REF=${{ steps.provenance.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.provenance.outputs.build_date }}
            SOURCE_URL=${{ steps.provenance.outputs.source }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - run: docker image inspect hermesstatus-server:${{ steps.provenance.outputs.candidate_tag }} --format '{{json .Config.Entrypoint}}' | grep serverstatus
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.client
          push: false
          load: true
          tags: hermesstatus-client:${{ steps.provenance.outputs.candidate_tag }}
          build-args: |
            VERSION=${{ steps.provenance.outputs.product_version }}
            VCS_REF=${{ steps.provenance.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.provenance.outputs.build_date }}
            SOURCE_URL=${{ steps.provenance.outputs.source }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
      - run: docker image inspect hermesstatus-client:${{ steps.provenance.outputs.candidate_tag }} --format '{{json .Config.Entrypoint}}' | grep entrypoint.sh
      - name: Validate image provenance
        run: |
          python3 scripts/validate_image_provenance.py \
            --server-image hermesstatus-server:${{ steps.provenance.outputs.candidate_tag }} \
            --client-image hermesstatus-client:${{ steps.provenance.outputs.candidate_tag }} \
            --candidate-tag "${{ steps.provenance.outputs.candidate_tag }}" \
            --version "${{ steps.provenance.outputs.product_version }}" \
            --revision "${{ steps.provenance.outputs.vcs_ref }}" \
            --created "${{ steps.provenance.outputs.build_date }}" \
            --source "${{ steps.provenance.outputs.source }}"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 scripts/check_release_boundaries.py
      - run: python3 scripts/check_unifi_static_authority.py

  publish_2_6_candidate:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'codex/2.6-') }}
    permissions:
      contents: read
      packages: write
    needs: [contracts, go, python, frontend, compose, security, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare immutable candidate
        id: provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          candidate_tag=$(printf '2.6-%.12s' "$SOURCE_SHA")
          for image in ghcr.io/${{ github.repository_owner }}/hermesstatus-server:$candidate_tag ghcr.io/${{ github.repository_owner }}/hermesstatus-client:$candidate_tag; do
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "refusing to overwrite existing immutable candidate: $image"
              exit 1
            fi
          done
          echo "candidate_tag=$candidate_tag" >> "$GITHUB_OUTPUT"
          echo "vcs_ref=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/hermesstatus-server:${{ steps.provenance.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.title=HermesStatus Server
            org.opencontainers.image.version=2.6
            org.opencontainers.image.revision=${{ steps.provenance.outputs.vcs_ref }}
            org.opencontainers.image.created=${{ steps.provenance.outputs.build_date }}
            org.opencontainers.image.source=https://github.com/404404/HermesStatus
            io.hermesstatus.component=server
          build-args: |
            VERSION=2.6
            VCS_REF=${{ steps.provenance.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.provenance.outputs.build_date }}
            SOURCE_URL=https://github.com/404404/HermesStatus
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.client
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/hermesstatus-client:${{ steps.provenance.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.title=HermesStatus Client
            org.opencontainers.image.version=2.6
            org.opencontainers.image.revision=${{ steps.provenance.outputs.vcs_ref }}
            org.opencontainers.image.created=${{ steps.provenance.outputs.build_date }}
            org.opencontainers.image.source=https://github.com/404404/HermesStatus
            io.hermesstatus.component=client
          build-args: |
            VERSION=2.6
            VCS_REF=${{ steps.provenance.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.provenance.outputs.build_date }}
            SOURCE_URL=https://github.com/404404/HermesStatus
