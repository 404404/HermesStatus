services:
  serverstatus-client:
    # Device v2 keeps SMART access to the single confirmed disk only.  This
    # replaces the legacy privileged/full-/dev defaults in the base Compose.
    privileged: false
    cap_add:
      - SYS_RAWIO
    devices:
      - ${SMART_DEVICE_HOST:-/dev/sda}:${SMART_DEVICE_CONTAINER:-/dev/sda}:r
    environment: !override
      HERMESSTATUS_CONFIG_FILE: /etc/hermesstatus/client-v2.json
      SMART_DEVICE: ${SMART_DEVICE_CONTAINER:-/dev/sda}
    volumes: !override
      - /etc/localtime:/etc/localtime:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /sys/class/hwmon:/sys/class/hwmon:ro
      # The collector is constrained in code to a read-only Docker API query.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HERMES_EXPORT_CONFIG_HOST:-./hermes-exporter.json}:${HERMES_EXPORT_CONFIG:-/app/hermes-exporter.json}:ro
      - ${HERMES_ROOT_HOST:-/home/hermes}:${HERMES_ROOT:-/home/hermes}:ro
      - ${CLIENT_STATUS_DIR_HOST:-./client-status}:${CLIENT_STATUS_DIR:-/var/lib/serverstatus-client}
      - ${LUCKY_TOKEN_FILE_HOST:-/dev/null}:${LUCKY_TOKEN_FILE:-/run/secrets/lucky-open-token}:ro
      - ./client-v2.example.json:/etc/hermesstatus/client-v2.json:ro
      - ./compute-01.token:/run/secrets/hermesstatus-device-token:ro
      - ./example-ca.crt:/etc/hermesstatus/example-ca.crt:ro
