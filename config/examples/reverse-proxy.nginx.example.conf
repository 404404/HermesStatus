log_format hermesstatus_device_safe
  '$remote_addr - $request_method $uri $status $body_bytes_sent';

upstream hermesstatus_server_backend {
  server serverstatus-server:80;
  keepalive 8;
}

server {
  listen 443 ssl;
  server_name status.example.invalid;

  ssl_certificate /etc/nginx/tls/example.crt;
  ssl_certificate_key /etc/nginx/tls/example.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_early_data off;

  client_max_body_size 1m;
  client_header_buffer_size 8k;
  large_client_header_buffers 4 8k;
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 30s;

  access_log /var/log/nginx/device-access.log hermesstatus_device_safe;
  error_log /var/log/nginx/device-error.log warn;

  location = /api/v2/device-updates {
    limit_except POST {
      deny all;
    }

    proxy_pass http://hermesstatus_server_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host hermesstatus-server;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Forwarded "for=$remote_addr;proto=https";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
  }

  location / {
    return 404;
  }
}
