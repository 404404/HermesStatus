services:
  hermesstatus-client:
    image: ghcr.io/404404/hermesstatus-client:${HERMESSTATUS_CLIENT_TAG:?set immutable 2.5 candidate tag}
    container_name: hermesstatus-client-2x
    restart: unless-stopped
    read_only: true
    network_mode: host
    pid: host
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid,nodev,noexec
      - /run/hermesstatus:size=4m,mode=0700,nosuid,nodev,noexec
    environment:
      HERMESSTATUS_CONFIG_FILE: /run/secrets/hermesstatus/client-config.json
      HOST_OS_RELEASE_FILE: /host/etc/os-release
      HWMON_ROOT: /sys/class/hwmon
      DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /sys/class/hwmon:/sys/class/hwmon:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/hermes/status/config/client-config.json:/run/secrets/hermesstatus/client-config.json:ro
      - ${DEVICE_TOKEN_HOST:-/home/hermes/status/secrets/device-token}:/run/secrets/hermesstatus-device-token:ro
      - /home/hermes/status/status:/var/lib/serverstatus-client
