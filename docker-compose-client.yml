services:
  serverstatus-client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        ALPINE_IMAGE: "${CLIENT_ALPINE_IMAGE:-alpine:3.13}"
    image: cppla/serverstatus:client
    container_name: serverstatus-client
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid,nodev,noexec
    network_mode: host
    pid: host
    # The base service deliberately maps no host block device. Add SYS_RAWIO
    # and one confirmed read-only `devices:` entry through an audited override;
    # never grant the whole /dev tree or privileged mode.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python3 /app/client-' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      SERVER: "${SERVER:-127.0.0.1}"
      # Do not let the host's USER environment override the agent username.
      SERVERSTATUS_USER: "${SERVERSTATUS_USER:-s01}"
      USER: "${SERVERSTATUS_USER:-s01}"
      PORT: "${PORT:-35601}"
      PASSWORD: "${PASSWORD:-USER_DEFAULT_PASSWORD}"
      INTERVAL: "${INTERVAL:-1}"
      PROBEPORT: "${PROBEPORT:-80}"
      PROBE_PROTOCOL_PREFER: "${PROBE_PROTOCOL_PREFER:-ipv4}"
      PING_PACKET_HISTORY_LEN: "${PING_PACKET_HISTORY_LEN:-100}"
      CU: "${CU:-cu.tz.cloudcpp.com}"
      CT: "${CT:-ct.tz.cloudcpp.com}"
      CM: "${CM:-cm.tz.cloudcpp.com}"
      CLIENT: "${CLIENT:-psutil}"
      HOST_OS_RELEASE_FILE: "${HOST_OS_RELEASE_FILE:-/host/etc/os-release}"
      HWMON_ROOT: "${HWMON_ROOT:-/sys/class/hwmon}"
      SMART_DEVICE: "${SMART_DEVICE:-auto}"
      DOCKER_SOCKET: "${DOCKER_SOCKET:-/var/run/docker.sock}"
      HARDWARE_INTERVAL: "${HARDWARE_INTERVAL:-600}"
      DOCKER_INTERVAL: "${DOCKER_INTERVAL:-60}"
      DOCKER_CONTAINER_LIMIT: "${DOCKER_CONTAINER_LIMIT:-0}"
      CLIENT_STATUS_DIR: "${CLIENT_STATUS_DIR:-/var/lib/serverstatus-client}"
      HERMES_EXPORT_CONFIG: "${HERMES_EXPORT_CONFIG:-/app/hermes-exporter.json}"
      HERMES_ROOT: "${HERMES_ROOT:-/home/hermes}"
      HERMES_STATUS_DIR: "${HERMES_STATUS_DIR:-/var/lib/serverstatus-client/hermes}"
      HERMES_STATUS_FILE: "${HERMES_STATUS_FILE:-/var/lib/serverstatus-client/hermes/hermes.json}"
      HERMES_EXPORT_ENABLED: "${HERMES_EXPORT_ENABLED:-true}"
      HERMES_EXPORT_INTERVAL: "${HERMES_EXPORT_INTERVAL:-600}"
      HERMES_SNAPSHOT_INTERVAL: "${HERMES_SNAPSHOT_INTERVAL:-10}"
      HERMES_API_TIMEOUT: "${HERMES_API_TIMEOUT:-2.5}"
      HERMES_API_PAGE_LIMIT: "${HERMES_API_PAGE_LIMIT:-100}"
      HERMES_API_MAX_PAGES: "${HERMES_API_MAX_PAGES:-100}"
      HERMES_HOST_USER: "${HERMES_HOST_USER:-hermes}"
      LUCKY_ENABLED: "${LUCKY_ENABLED:-false}"
      LUCKY_BASE_URL: "${LUCKY_BASE_URL:-https://127.0.0.1:16601}"
      LUCKY_AUTH_MODE: "${LUCKY_AUTH_MODE:-none}"
      LUCKY_TOKEN_FILE: "${LUCKY_TOKEN_FILE:-}"
      LUCKY_INTERVAL: "${LUCKY_INTERVAL:-600}"
      LUCKY_TIMEOUT_SECONDS: "${LUCKY_TIMEOUT_SECONDS:-5}"
      LUCKY_VERSION_CHECK_TTL: "${LUCKY_VERSION_CHECK_TTL:-21600}"
      LUCKY_VERIFY_TLS: "${LUCKY_VERIFY_TLS:-true}"
      LUCKY_CERT_WARNING_DAYS: "${LUCKY_CERT_WARNING_DAYS:-30}"
      EASYTIER_ENABLED: "${EASYTIER_ENABLED:-false}"
      EASYTIER_CLI_PATH: "${EASYTIER_CLI_PATH:-/usr/local/bin/easytier-cli}"
      EASYTIER_RPC_PORTAL: "${EASYTIER_RPC_PORTAL:-127.0.0.1:15888}"
      EASYTIER_TIMEOUT_SECONDS: "${EASYTIER_TIMEOUT_SECONDS:-5}"
      EASYTIER_INTERVAL_SECONDS: "${EASYTIER_INTERVAL_SECONDS:-30}"
      EASYTIER_CONFIG_FILE: "${EASYTIER_CONFIG_FILE:-}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /sys/class/hwmon:/sys/class/hwmon:ro
      # A read-only bind does not make the Docker API read-only. The collector
      # is constrained in code to GET /containers/json?all=1 only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HERMES_EXPORT_CONFIG_HOST:-./hermes-exporter.json}:${HERMES_EXPORT_CONFIG:-/app/hermes-exporter.json}:ro
      - ${HERMES_ROOT_HOST:-/home/hermes}:${HERMES_ROOT:-/home/hermes}:ro
      - ${CLIENT_STATUS_DIR_HOST:-./client-status}:${CLIENT_STATUS_DIR:-/var/lib/serverstatus-client}
      # A disabled token path is genuinely absent to the collector. The
      # harmless /dev/null mount keeps this optional bind syntactically valid
      # without creating an empty credential file.
      - ${LUCKY_TOKEN_FILE_HOST:-/dev/null}:${LUCKY_TOKEN_FILE_MOUNT_PATH:-/run/secrets/lucky-open-token}:ro
