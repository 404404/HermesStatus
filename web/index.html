<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="HermesStatus 单主机云监控面板" />
    <title>云监控</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/app.css?v=20260714-1" />
</head>
<body>
    <header class="topbar">
        <div class="brand" title="云监控">
            <span class="logo-mark" aria-hidden="true">
                <svg viewBox="0 0 128 86" width="24" height="18" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 46H28L38 34L55 82L65 4L74 47H88M100 47H110M122 47H126" />
                </svg>
            </span>
            <span class="logo-text"><span class="logo-accent">云</span>监控</span>
        </div>
        <nav class="nav" aria-label="主导航">
            <button type="button" class="active" aria-current="page">主机</button>
        </nav>
        <div class="actions">
            <span id="lastUpdate" class="last-update">上次刷新：-</span>
            <button id="refreshButton" type="button" class="tool-button refresh-button" title="刷新数据" aria-label="刷新数据">刷新</button>
            <button id="themeToggle" type="button" class="tool-button theme-button" title="切换明暗主题" aria-label="切换明暗主题">明暗</button>
        </div>
    </header>

    <main class="wrapper">
        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
        <div id="emptyState" class="empty-state page-empty" hidden>暂无主机数据</div>

        <div id="dashboard" class="dashboard" hidden>
            <section id="overviewCards" class="overview-grid" aria-label="运行概览"></section>
            <section id="hardwareHealth" class="health-grid" aria-label="硬件健康"></section>

            <section class="data-section" aria-labelledby="profilesTitle">
                <div class="section-head">
                    <h2 id="profilesTitle">Hermes Agent Profiles</h2>
                    <span id="profilesMeta" class="section-meta"></span>
                </div>
                <div class="table-wrap">
                    <table class="data profiles-table">
                        <thead>
                        <tr>
                            <th>配置/Profile</th>
                            <th>服务状态</th>
                            <th>网关状态</th>
                            <th>API 状态</th>
                            <th>运行模式</th>
                            <th>模型/模式/提供商</th>
                            <th>定时任务</th>
                            <th>会话数</th>
                            <th>输入/输出/总 Token</th>
                        </tr>
                        </thead>
                        <tbody id="profilesBody"></tbody>
                    </table>
                </div>
            </section>

            <section class="data-section" aria-labelledby="containersTitle">
                <div class="section-head">
                    <h2 id="containersTitle">Docker Containers</h2>
                    <span id="containersMeta" class="section-meta"></span>
                </div>
                <div class="table-wrap">
                    <table class="data containers-table">
                        <thead>
                        <tr>
                            <th>容器 ID</th>
                            <th>名称</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>镜像</th>
                            <th>命令</th>
                            <th>端口</th>
                        </tr>
                        </thead>
                        <tbody id="containersBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <div id="profileModal" class="modal-backdrop" hidden>
        <section class="modal-box" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
            <button id="profileModalClose" type="button" class="modal-close" title="关闭" aria-label="关闭">×</button>
            <div class="modal-heading">
                <h2 id="profileModalTitle">Profile 详情</h2>
                <span id="profileModalState" class="badge neutral"></span>
            </div>
            <div id="profileModalContent" class="modal-content"></div>
        </section>
    </div>

    <footer class="footer">
        <a href="https://github.com/404404/HermesStatus" target="_blank" rel="noopener">HermesStatus</a>
    </footer>

    <script src="js/app.js?v=20260714-1" defer></script>
</body>
</html>
