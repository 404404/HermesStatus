<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="description" content="云监控,J4125,ServerStatus" />
    <title>云监控</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/app.css?v=20260711-cpu-model-value-style" />
</head>
<body>
    <header class="topbar">
        <div class="brand" title="云监控">
            <span class="logo-mark" aria-hidden="true">
                <svg viewBox="0 0 128 86" width="24" height="18" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 46H28L38 34L55 82L65 4L74 47H88M100 47H110M122 47H126" />
                </svg>
            </span>
            <span class="logo-text"><span class="logo-accent">云</span>监控</span>
        </div>
        <nav class="nav" id="navTabs">
            <button type="button" data-tab="host" class="active">主机</button>
        </nav>
        <div class="actions">
            <span id="lastUpdate" class="muted">更新中...</span>
            <button id="manualRefresh" type="button" title="手动刷新">刷新</button>
        </div>
    </header>

    <main class="wrapper">
        <div id="notice" class="notice info">初始化中...</div>

        <section id="panel-host" class="panel active" aria-label="主机">
            <section class="overview-grid" id="overviewCards" aria-label="运行概览"></section>
            <section class="health-grid" id="hardwareCards" aria-label="硬件健康"></section>

            <section class="data-panel">
                <div class="section-head">
                    <div>
                        <h2>Hermes Agent Profiles</h2>
                    </div>
                    <span id="hermesAgentVersion" class="section-meta mono">Hermes Agent -</span>
                </div>
                <div class="table-wrap">
                    <table class="data">
                        <thead>
                        <tr>
                            <th>配置</th>
                            <th>服务状态</th>
                            <th>网关状态</th>
                            <th>API状态</th>
                            <th>运行模式</th>
                            <th>模型/模式/提供商</th>
                            <th>定时任务</th>
                            <th>会话数</th>
                            <th>输出/输入/总Token数</th>
                        </tr>
                        </thead>
                        <tbody id="hermesBody"></tbody>
                    </table>
                </div>
            </section>

            <section class="data-panel">
                <div class="section-head">
                    <div>
                        <h2>Docker Containers</h2>
                    </div>
                </div>
                <div class="table-wrap">
                    <table class="data docker-table">
                        <thead>
                        <tr>
                            <th>容器ID</th>
                            <th>名称</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>镜像</th>
                            <th>命令</th>
                            <th>端口</th>
                        </tr>
                        </thead>
                        <tbody id="dockerBody"></tbody>
                    </table>
                </div>
            </section>
        </section>

    </main>

    <footer class="footer">
        <a href="https://github.com/cppla/ServerStatus" target="_blank" rel="noopener">ServerStatus中文版</a>
    </footer>

    <div id="profileModal" class="modal-backdrop" style="display:none;">
        <aside class="modal-box" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
            <button class="modal-close" id="profileClose" aria-label="关闭">×</button>
            <h3 id="profileTitle" class="modal-title">Hermes 配置详情</h3>
            <div id="profileContent" class="modal-content">加载中...</div>
        </aside>
    </div>

    <script src="js/app.js?v=20260711-cpu-model-no-r" defer></script>
</body>
</html>
